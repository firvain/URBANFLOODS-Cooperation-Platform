[project]
name = "urbanfloods-cooperation-backend"
version = "0.1.0"
description = "URBANFLOODS Cooperation Platform API"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "structlog>=24.4",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "aiosmtplib>=3.0",
    "jinja2>=3.1",
    "httpx>=0.28",
    "email-validator>=2.2",
    "nh3>=0.2.18",
    "python-slugify>=8.0",
    "pillow>=11",
    "cachetools>=5.5",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "pytest-cov",
    "httpx",
    "asgi-lifespan",
    "testcontainers[postgres]>=4",
    "ruff>=0.8",
    "respx>=0.22",
    "freezegun>=1.5",
    "types-cachetools>=7.0.0.20260713",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
# The local alembic/ migrations directory would otherwise make ruff treat `alembic` as first-party.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session: the app's module-level async engine pools
# asyncpg connections, which are bound to the loop that created them.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

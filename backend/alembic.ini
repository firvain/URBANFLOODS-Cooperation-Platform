# Alembic configuration for the Cooperation Platform backend.
# The database URL is NOT set here: alembic/env.py reads settings.DATABASE_URL (app/core/config.py).

[alembic]
# Resolved relative to this file, so `alembic -c path/to/alembic.ini` works from any directory.
script_location = %(here)s/alembic

# Revision files are named like 0001_extensions.py (pass --rev-id 0002 etc. to `alembic revision`).
file_template = %%(rev)s_%%(slug)s

# Prepended to sys.path so env.py can import `app`.
prepend_sys_path = .
path_separator = os

# Logging (used by the `alembic` CLI only; programmatic callers keep their own logging).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# nginx inside the production frontend container (frontend/Dockerfile.prod).
#
# The host nginx terminates TLS for cooperation.urbanfloods.app and proxies every request to this
# container on 127.0.0.1:3002. Here the built SPA is served and the backend paths are proxied to
# the backend service, so browser, API, uploads, feeds and probes all share one origin.
# HSTS is set by the host nginx (over TLS), not here.

# Keep the scheme the host nginx reports (https); fall back to this hop's scheme for direct
# requests (local curl checks on 127.0.0.1:3002). The backend's CSRF origin check reads it.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Redirects nginx itself issues stay relative (it does not know the public scheme or host).
    absolute_redirect off;

    # Image uploads are capped at 5 MiB by the backend; leave room for the multipart overhead.
    client_max_body_size 6m;

    # Compression for text responses, proxied ones (JSON, Atom, XML) included.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/atom+xml application/manifest+json image/svg+xml;

    # --- security headers ----------------------------------------------------------------------
    # Inherited by every location below that has no add_header of its own (/assets/ has one and
    # repeats them; /docs deliberately does not). Turnstile (register, resend, forgot password)
    # loads its script from challenges.cloudflare.com and renders in an iframe from there; KNOWBASE
    # measure photos are hot-linked from knowbase.urbanfloods.app. JSON-LD
    # <script type="application/ld+json"> blocks are data, not executed, so they need no
    # script-src allowance.
    set $csp "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://knowbase.urbanfloods.app; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- backend proxy settings ----------------------------------------------------------------
    # Docker's embedded DNS, re-resolved every 10 s: proxying through a variable makes nginx look
    # the backend up per request, so a recreated backend container (new IP) is found without
    # restarting this one, and nginx starts even while the backend is still down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # Inherited by every proxied location (none sets its own). Request headers not named here,
    # CF-Connecting-IP in particular, are forwarded unchanged: the backend reads it for rate limits
    # and Turnstile when TRUST_PROXY_HEADERS=true.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # --- container healthcheck (nginx only, never reaches the backend) --------------------------
    location = /health-check {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- backend paths ---------------------------------------------------------------------------
    # REST API (also serves /api/v1/openapi.json, linked from the open-data page).
    location /api/ {
        proxy_pass $backend;
    }

    # Uploaded images (random names, re-encoded WebP). The backend already sends nosniff; it is
    # hidden here so the response carries the single copy added above. `expires` only applies to
    # successful responses, so a 404 for a missing file is not cached.
    location /static/ {
        proxy_pass $backend;
        proxy_hide_header X-Content-Type-Options;
        expires 7d;
    }

    # Atom feeds of posts and threads.
    location /feeds/ {
        proxy_pass $backend;
    }

    # Generated by the backend from the published content (FRONTEND_URL absolute links).
    location = /sitemap.xml {
        proxy_pass $backend;
    }

    location = /robots.txt {
        proxy_pass $backend;
    }

    # Swagger UI (ENABLE_DOCS=true; the spec itself is /api/v1/openapi.json above), plus its
    # /docs/oauth2-redirect page. Swagger loads its JS/CSS from a CDN and runs an inline script,
    # which the SPA's CSP would block, so the security headers above are NOT inherited here: the
    # add_header below replaces them all (only nosniff is kept). The backend sends no CSP.
    location = /docs {
        proxy_pass $backend;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /docs/ {
        proxy_pass $backend;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Liveness and readiness probes, reachable through 127.0.0.1:3002 as well.
    location = /health {
        access_log off;
        proxy_pass $backend;
    }

    location = /health/ready {
        access_log off;
        proxy_pass $backend;
    }

    # --- SPA ---------------------------------------------------------------------------------------
    # Hashed build output: cache for a year. A missing chunk is a 404, never index.html.
    # add_header here stops inheritance, so the security headers are repeated.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # The entry document must always be revalidated so a deploy is picked up at once.
    # `expires -1` sends "Cache-Control: no-cache" without an add_header, so the security headers
    # above still apply.
    location = /index.html {
        expires -1;
    }

    # Public files (favicons, manifest, partner logos), else the SPA's client-side routes.
    # No `$uri/`: public/partners/ is a directory and would shadow the /partners route with a 403.
    location / {
        try_files $uri /index.html;
    }
}

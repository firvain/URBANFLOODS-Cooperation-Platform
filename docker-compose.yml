# Development stack: Postgres, Mailpit, FastAPI (auto-reload) and Vite (HMR).
#
#   cp .env.example .env          # optional; every variable has a default
#   docker compose up --build     # add --watch to rebuild images when dependency files change
#
#   Frontend      http://localhost:5173
#   API + docs    http://localhost:8000/docs
#   Mailpit UI    http://localhost:8025   (SMTP on localhost:1025)
#
# Backend and frontend source is bind-mounted, so edits reload without a rebuild. A change to
# backend/pyproject.toml, uv.lock or frontend/package*.json needs a rebuild:
#   docker compose up --build -V  (-V renews the anonymous node_modules volume), or run with --watch.
# Not for production: see docker-compose.prod.yml (M6).

name: urbanfloods-cooperation

services:
  postgres:
    image: postgres:16-alpine
    container_name: urbanfloods-cooperation-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cooperation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cooperation_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cooperation_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ defers expansion to the container shell, so the check always matches the env above.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: urbanfloods-cooperation-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025" # web UI + REST API (used by Playwright e2e)
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP

  # One-shot: the backend image runs as uid 10001, but a fresh named volume is owned by root.
  backend-uploads-init:
    image: busybox:1.37
    container_name: urbanfloods-cooperation-uploads-init
    command: ["chown", "-R", "10001:10001", "/app/uploads"]
    volumes:
      - backend_uploads:/app/uploads

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: urbanfloods-cooperation-backend:dev
    container_name: urbanfloods-cooperation-backend
    # The image ENTRYPOINT still runs `alembic upgrade head` first; only CMD is replaced.
    command: ["fastapi", "dev", "app/main.py", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cooperation}:${POSTGRES_PASSWORD:-cooperation_dev_password}@postgres:5432/${POSTGRES_DB:-cooperation_db}
      ENV: dev
      ENABLE_DOCS: "true"
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      FRONTEND_URL: http://localhost:5173
      COOKIE_SECURE: "false"
      EMAIL_ENABLED: "true"
      # Mailpit by default; set SMTP_* in .env to send real mail from the dev stack (e.g. a Brevo
      # SMTP key) and remove them again afterwards.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@cooperation.localhost}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-URBANFLOODS Cooperation Platform (dev)}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-louta@uowm.gr}
      TURNSTILE_ENABLED: "false"
      RATE_LIMIT_ENABLED: "true"
      ENABLE_SCHEDULER: "false"
      LOG_JSON: "false"
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/scripts:/app/scripts
      - backend_uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      backend-uploads-init:
        condition: service_completed_successfully
    # The test command comes from the image's HEALTHCHECK; only the timing is tightened for dev.
    healthcheck:
      interval: 10s
      start_period: 20s
    develop:
      watch:
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/uv.lock

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: urbanfloods-cooperation-frontend:dev
    container_name: urbanfloods-cooperation-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
      VITE_DSS_URL: ${DSS_URL:-https://urbanfloods.finki.ukim.mk/}
      # Vite's /static proxy (uploaded images) must reach the backend service, not localhost.
      VITE_DEV_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      # Legal pages (/terms, /privacy) are built from the markdown in docs/legal.
      - ./docs/legal:/docs/legal:ro
      # Anonymous volume: keep the image's Linux node_modules instead of the host's.
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    develop:
      watch:
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json

volumes:
  postgres_data:
  backend_uploads:

networks:
  default:
    name: urbanfloods-cooperation-network
